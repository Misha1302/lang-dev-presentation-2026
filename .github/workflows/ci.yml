name: Presentation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-slide-deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed slide deck contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          slides = re.findall(r'<section class="slide[^"]*" id="s(\d+)"', html)
          assert len(slides) == 24, len(slides)
          assert slides == [str(i) for i in range(1, 25)], slides
          for required in [
              'Compose the Language', 'Prove the Program', 'Erase the Abstraction',
              'InvokeDelegate(f, 42)', 'Foo(42)', 'EXTEND', 'RESOLVE', 'PROVE', 'ERASE',
              'UniversalToolchain is evidence, not the thesis',
              'This is not a universal ontology', 'Unknown is not false'
          ]:
              assert required in html, required
          script = re.search(r'<script>([\s\S]*)</script>', html).group(1)
          Path('/tmp/deck-script.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/deck-script.js
