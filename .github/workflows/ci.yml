name: Presentation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deck-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate authored HTML, live notes, narrative and demo/source contract
        run: python3 scripts/check_deck.py
      - name: Check JavaScript syntax for deck and live speaker notes
        run: |
          node --check deck.js
          node --check speaker-notes-1.js
          node --check speaker-notes-2.js
          node --check speaker-notes-hardening.js
      - name: Audit authored conference timing budget
        run: python3 scripts/timing_audit.py
      - name: Checkout exact UniversalToolchain truth snapshot
        uses: actions/checkout@v4
        with:
          repository: Misha1302/UniversalToolchain
          ref: 7005371d6c30175dff4b0e9f906a26218b0ee54d
          path: _deps/UniversalToolchain
      - name: Run canonical source-backed planner/runtime demo
        run: |
          ./demo/run-demo.sh "$GITHUB_WORKSPACE/_deps/UniversalToolchain" | tee demo-source-output.txt
          grep -Fq "[planning] UTL2002:" demo-source-output.txt
          grep -Fq "[planning] preferred provider: demo.provider.a" demo-source-output.txt
          grep -Fq "[route:base] cost=7 | demo.parse -> demo.lower.safe" demo-source-output.txt
          grep -Fq "[route:+fast-path] cost=2 | demo.parse -> demo.lower.fast" demo-source-output.txt
          grep -Fq "[route] Cost is declared planning weight, not measured runtime latency." demo-source-output.txt
          grep -Fq "[runtime] input=41 output=42" demo-source-output.txt
      - name: Render-check all slides at conference viewports
        run: python3 scripts/check_render.py
      - name: Re-open deployed GitHub Pages in Chromium
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/check_production.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-validation-evidence
          path: |
            render-artifacts/*.png
            production-artifacts/*.png
            demo-source-output.txt
          if-no-files-found: ignore
