name: Presentation CI

on:
  push:
    branches: [main, content/langdev-finalization-2026-09]
  pull_request:

permissions:
  contents: read

jobs:
  delegates-rebuild-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate delegates rebuild narrative and validation record
        run: python3 scripts/check_deck.py
      - name: Check JavaScript syntax for retained runtime assets
        run: |
          set -euo pipefail
          node --check deck.js
          for file in deck-*.js speaker-script-*.js; do node --check "$file"; done
      - name: Audit spoken timing
        run: python3 scripts/timing_audit.py
      - name: Render smoke check
        run: python3 scripts/check_render.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegates-rebuild-validation-evidence
          path: render-artifacts/*.png
          if-no-files-found: ignore
