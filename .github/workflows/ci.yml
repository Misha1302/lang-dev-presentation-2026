name: Presentation CI

on:
  push:
    branches: [main, content/langdev-finalization-2026-09]
  pull_request:

permissions:
  contents: read

jobs:
  deck-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate semantic narrative and canonical speaker ownership
        run: python3 scripts/check_deck.py

      - name: Probe semantic contract invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import subprocess
          import tempfile

          root = Path.cwd()

          def clone_fixture() -> Path:
              temp = Path(tempfile.mkdtemp(prefix='semantic-contract-'))
              for name in [
                  'index.html', 'deck-main.js', 'deck-appendix.js', 'deck.js',
                  'speaker-script-canonical.js', 'CONTENT_NARRATIVE_CONTRACT.json',
                  'claims.md', 'README.md'
              ]:
                  shutil.copy2(root / name, temp / name)
              (temp / 'scripts').mkdir()
              shutil.copy2(root / 'scripts/check_deck.py', temp / 'scripts/check_deck.py')
              return temp

          def run_check(path: Path) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  ['python3', 'scripts/check_deck.py'],
                  cwd=path,
                  capture_output=True,
                  text=True,
              )

          wording = clone_fixture()
          deck = wording / 'deck-main.js'
          text = deck.read_text(encoding='utf-8')
          old = 'A monolithic compiler is often the right answer'
          assert old in text
          deck.write_text(text.replace(old, 'A monolith remains the baseline for one-owner languages', 1), encoding='utf-8')
          result = run_check(wording)
          assert result.returncode == 0, 'visible wording rename unexpectedly changed narrative truth: ' + result.stderr + result.stdout

          causal = clone_fixture()
          contract_path = causal / 'CONTENT_NARRATIVE_CONTRACT.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['milestones']['monolith-baseline']['owner'] = 'm52'
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')
          result = run_check(causal)
          assert result.returncode != 0, 'causal-order violation was not rejected'

          speech = clone_fixture()
          script = speech / 'speaker-script-canonical.js'
          text = script.read_text(encoding='utf-8')
          marker = '  "m52": '
          start = text.index(marker)
          end = text.index('\n  "a1":', start)
          script.write_text(text[:start] + text[end + 1:], encoding='utf-8')
          result = run_check(speech)
          assert result.returncode != 0, 'missing canonical speaker entry was not rejected'

          print('Semantic contract probes PASS: wording independence, causal-order rejection, speaker-coverage rejection')
          PY

      - name: Check JavaScript syntax and runtime QA contract
        run: |
          set -euo pipefail
          node --check deck.js
          grep -Fq "const DECK_QA_CONTRACT = 'architecture-story-v3';" deck.js
          for file in deck-*.js speaker-script-*.js; do
            node --check "$file"
          done

      - name: Audit stage-ready spoken timing
        run: python3 scripts/timing_audit.py

      - name: Checkout current UniversalToolchain witness
        uses: actions/checkout@v4
        with:
          repository: Misha1302/UniversalToolchain
          ref: master
          path: _deps/UniversalToolchain

      - name: Record resolved UniversalToolchain witness revision
        working-directory: _deps/UniversalToolchain
        run: |
          set -euo pipefail
          UT_SHA="$(git rev-parse HEAD)"
          echo "UniversalToolchain master witness: $UT_SHA"
          printf '%s\n' "$UT_SHA" > "$GITHUB_WORKSPACE/ut-witness-sha.txt"

      - name: Verify UT benchmark claim boundary without treating smoke as performance evidence
        run: |
          set -euo pipefail
          test -f _deps/UniversalToolchain/UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/FormulaHotPathBenchmarks.cs
          grep -Fq 'Steady-state invocation of already prepared formula artifacts' _deps/UniversalToolchain/UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/README.md
          grep -Fq 'Treat the `Dry` job as discovery/runtime smoke only, never as performance evidence.' _deps/UniversalToolchain/docs/reference/benchmark-methodology.md

      - name: Run current pricing and cross-backend parity witness
        run: |
          ./demo/run-demo.sh "$GITHUB_WORKSPACE/_deps/UniversalToolchain" | tee demo-source-output.txt
          grep -Fq '[language] pricing-restricted dialect' demo-source-output.txt
          grep -Fq '[pricing:interpreter] result=95' demo-source-output.txt
          grep -Fq '[pricing:cil] result=95' demo-source-output.txt
          grep -Fq '[parity] shadowing regression PASS' demo-source-output.txt

      - name: Re-run conference demo without build or restore
        run: |
          DEMO_NO_BUILD=1 ./demo/run-demo.sh "$GITHUB_WORKSPACE/_deps/UniversalToolchain" | tee demo-stage-output.txt
          grep -Fq '[pricing:interpreter] result=95' demo-stage-output.txt
          grep -Fq '[pricing:cil] result=95' demo-stage-output.txt
          grep -Fq '[parity] shadowing regression PASS' demo-stage-output.txt

      - name: Verify local 3-to-1 deabstraction witness on current master
        working-directory: _deps/UniversalToolchain
        run: |
          dotnet test UniversalToolchain/UniversalToolchain.Modules.Tests/UniversalToolchain.Modules.Tests.csproj \
            -c Release \
            --filter 'FullyQualifiedName~TypedIntrinsicEmitterOptimizerTests' \
            --verbosity minimal

      - name: Verify route-order feasibility appendix witness on current master
        working-directory: _deps/UniversalToolchain
        run: |
          dotnet test UniversalToolchain/UniversalToolchain.LanguageSdk.Tests/UniversalToolchain.LanguageSdk.Tests.csproj \
            -c Release \
            --filter 'FullyQualifiedName~PlannerPolicyControlTests.RouteSearch_ShouldChooseMoreExpensiveRoute_WhenCheaperRouteViolatesDescriptorOrder' \
            --verbosity minimal

      - name: Render-check every audience and presenter slide
        run: python3 scripts/check_render.py

      - name: Re-open deployed GitHub Pages and compare exact production assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/check_production.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-validation-evidence
          path: |
            render-artifacts/*.png
            production-artifacts/*.png
            demo-source-output.txt
            demo-stage-output.txt
            ut-witness-sha.txt
          if-no-files-found: ignore
