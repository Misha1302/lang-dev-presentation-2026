name: Presentation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Check canonical site contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          index = (root / "index.html").read_text(encoding="utf-8")
          css = (root / "styles.css").read_text(encoding="utf-8")
          js = (root / "script.js").read_text(encoding="utf-8")
          standalone = (root / "langdev-talk-standalone.html").read_text(encoding="utf-8")

          assert '<link rel="stylesheet" href="styles.css" />' in index
          assert '<script src="script.js"></script>' in index
          assert css.strip() in standalone
          assert js.strip() in standalone

          required_ids = [
              "opening", "problem", "semantics", "baselines", "capabilities",
              "ownership", "times", "proof", "evidence", "lifecycle",
              "erase", "model", "research", "final",
          ]
          for scene_id in required_ids:
              assert f'id="{scene_id}"' in index, scene_id

          assert "EXTEND" in index
          assert "RESOLVE" in index
          assert "PROVE" in index
          assert "ERASE" in index
          assert "InvokeDelegate" in index
          assert "Foo(42)" in index

          print("Presentation static contract PASS")
          PY
