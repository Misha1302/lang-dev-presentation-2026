name: Presentation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deck-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate authored deck, notes and causal narrative
        run: python3 scripts/check_deck.py
      - name: Check JavaScript syntax for runtime and split deck assets
        run: |
          node --check deck.js
          for file in deck-act-*.js speaker-notes-*.js; do node --check "$file"; done
      - name: Audit intellectual-deck timing without an upper cap
        run: python3 scripts/timing_audit.py
      - name: Checkout exact UniversalToolchain demo snapshot
        uses: actions/checkout@v4
        with:
          repository: Misha1302/UniversalToolchain
          ref: 7005371d6c30175dff4b0e9f906a26218b0ee54d
          path: _deps/UniversalToolchain
      - name: Run canonical pricing and cross-backend parity demo
        run: |
          ./demo/run-demo.sh "$GITHUB_WORKSPACE/_deps/UniversalToolchain" | tee demo-source-output.txt
          grep -Fq "[language] pricing-restricted dialect" demo-source-output.txt
          grep -Fq "[pricing:interpreter] result=95" demo-source-output.txt
          grep -Fq "[pricing:cil] result=95" demo-source-output.txt
          grep -Fq "[parity] external bindings + local shadowing" demo-source-output.txt
          grep -Fq "[parity] shadowing regression PASS" demo-source-output.txt
      - name: Re-run conference demo without build or restore
        run: |
          DEMO_NO_BUILD=1 ./demo/run-demo.sh "$GITHUB_WORKSPACE/_deps/UniversalToolchain" | tee demo-stage-output.txt
          grep -Fq "[language] pricing-restricted dialect" demo-stage-output.txt
          grep -Fq "[pricing:interpreter] result=95" demo-stage-output.txt
          grep -Fq "[pricing:cil] result=95" demo-stage-output.txt
          grep -Fq "[parity] external bindings + local shadowing" demo-stage-output.txt
          grep -Fq "[parity] shadowing regression PASS" demo-stage-output.txt
      - name: Render-check every slide at conference and stress viewports
        run: python3 scripts/check_render.py
      - name: Re-open deployed GitHub Pages in Chromium
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/check_production.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-validation-evidence
          path: |
            render-artifacts/*.png
            production-artifacts/*.png
            demo-source-output.txt
            demo-stage-output.txt
          if-no-files-found: ignore
