name: Presentation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-slide-deck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install render dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate production navigation, reveals, geometry and timing
        run: python scripts/validate_deck.py --output qa/ci
      - name: Archive screenshots and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deck-render-qa
          path: qa/ci
