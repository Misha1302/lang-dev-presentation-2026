name: One-shot presentation CI fix

on:
  push:
    branches: [ai/presentation-fix-ci-2026-09-03]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/presentation-fix-ci-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix escaped speaker note
        run: python3 scripts/_fix_ci_notes.py
      - name: Validate deck contract
        run: python3 scripts/check_deck.py
      - name: Validate JavaScript syntax
        run: |
          node --check deck.js
          node --check speaker-notes-1.js
          node --check speaker-notes-2.js
          node --check speaker-notes-hardening.js
      - name: Validate timing
        run: python3 scripts/timing_audit.py
      - name: Remove one-shot files and commit
        run: |
          rm scripts/_fix_ci_notes.py
          rm .github/workflows/_fix_ci_notes.yml
          git config user.name "CompilationLab presentation audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix speaker-note escaping after slide merge"
          git push origin HEAD:ai/presentation-fix-ci-2026-09-03
