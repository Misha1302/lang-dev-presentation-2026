name: Research Insertion Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  additive-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify protected slides, speech and research insertion
        run: python3 scripts/check_research_insertion.py
