name: Apply semantic repair payload

on:
  push:
    branches: [audit/semantic-content-20260904]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify repair payload
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/chunk-* > /tmp/repair.b64
          base64 -d /tmp/repair.b64 > /tmp/repair.tar.gz
          echo '18e9b0171f04d1adc4664b79d07881674f172b1786f9ead8a096e8af44c394bc  /tmp/repair.tar.gz' | sha256sum -c -
          rm -rf /tmp/repair
          mkdir /tmp/repair
          tar -xzf /tmp/repair.tar.gz -C /tmp/repair
          cd /tmp/repair/semantic-repair-payload
          tail -n +3 repair-manifest.txt | while read -r expected path; do
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || { echo "$path hash mismatch: $actual != $expected"; exit 1; }
          done
      - name: Apply repair and validate
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/repair/semantic-repair-payload
          tail -n +3 "$src/repair-manifest.txt" | while read -r expected path; do
            mkdir -p "$(dirname "$path")"
            cp "$src/$path" "$path"
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || { echo "$path post-copy hash mismatch"; exit 1; }
          done
          python3 scripts/check_deck.py
          node --check deck.js
          for file in deck-act-*.js speaker-notes-*.js; do node --check "$file"; done
          python3 scripts/timing_audit.py
          python3 scripts/check_render.py
      - name: Commit repaired tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair .github/workflows/apply-semantic-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair semantic and content boundaries'
          git push origin HEAD:audit/semantic-content-20260904
